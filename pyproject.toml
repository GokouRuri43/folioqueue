[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "folioqueue"
version = "0.1.0"
description = "Restartable local document-to-Markdown batches with a checksum ledger and failure isolation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "GokouRuri43"}]
keywords = ["markitdown", "markdown", "document-conversion", "incremental", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = []

[project.optional-dependencies]
documents = ["markitdown[pdf,docx]>=0.1.7,<0.2"]
test = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "build>=1,<2", "twine>=6,<7"]

[project.scripts]
folioqueue = "folioqueue.cli:main"

[project.urls]
Homepage = "https://github.com/GokouRuri43/folioqueue"
Issues = "https://github.com/GokouRuri43/folioqueue/issues"
Changelog = "https://github.com/GokouRuri43/folioqueue/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/folioqueue"]
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = ["src", "tests", "examples", "docs", "scripts", "README.md", "README.zh-CN.md", "LICENSE", "CHANGELOG.md", "CONTRIBUTING.md", "SECURITY.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: exercises the optional MarkItDown document backend"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Embedded HTML/CSS and synthetic XML/PDF fixtures contain long literal lines.
"src/folioqueue/report.py" = ["E501"]
"tests/conftest.py" = ["E501"]

[tool.coverage.run]
patch = ["subprocess"]
parallel = true
