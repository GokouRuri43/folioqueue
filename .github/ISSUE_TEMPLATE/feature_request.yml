name: Workflow request
description: Describe a real document-maintenance workflow.
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Include your current workflow and why existing behavior is insufficient.
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: Suggested behavior and alternatives considered
    validations:
      required: true
